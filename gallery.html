<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY | nemuheim.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-link"><h1 class="logo">nemuheim. website</h1></a>
    </header>
    <main class="gallery-container">
        <h2>GALLERY</h2>
        <div class="filter-buttons">
            <button class="filter-btn" data-filter="all">ALL</button>
            <button class="filter-btn" data-filter="illustration">ILLUSTRATION</button>
            <button class="filter-btn" data-filter="craft">CRAFT</button>
            <button class="filter-btn" data-filter="works">WORKS</button>
        </div>
        <div class="gallery-grid">
            <div class="gallery-item illustration"><img src="images/img1.jpg" alt="img1"></div>
        </div>
    </main>
    <script src="gallery.js"></script>
</body>
</html>
